<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S1914 Strategy Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top-hud">
    <div class="hud-left">
        <span class="game-title">STRATEGY HUB</span>
        <nav class="main-nav">
            <button class="nav-btn active" onclick="switchTab('map-view')">🗺️ Карта</button>
            <button class="nav-btn" onclick="switchTab('tools-view')">🧮 Инструменты</button>
        </nav>
    </div>
    <div class="hud-center" id="team-scores">
        <div class="hud-team blue"><span>СИНИЕ</span><span id="hud-blue-total">0</span></div>
        <div class="hud-team red"><span>КРАСНЫЕ</span><span id="hud-red-total">0</span></div>
    </div>
    <div class="hud-right">
        <button id="themeToggle" class="theme-btn">🌙</button>
    </div>
</header>

<main class="main-content">
    <div id="map-view" class="view-section active">
        <div class="container-map">
            <div class="map-wrapper">
                <canvas id="gameCanvas"></canvas>
            </div>
            <div class="sidebar">
                <div class="card">
                    <h3>Ресурсы</h3>
                    <div class="table-responsive">
                        <table id="resourceTable">
                            <thead>
                                <tr><th>Страна</th><th>Ком</th><th>🌾</th><th>🐟</th><th>🔩</th><th>🪵</th><th>🪨</th><th>🛢️</th><th>🔥</th></tr>
                            </thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="tools-view" class="view-section hidden">
        <div class="tools-grid">
            
            <div class="tool-card">
                <h3>⏳ Время хода</h3>
                <div class="form-group">
                    <label>Расстояние (км):</label>
                    <input type="number" id="time-distance" placeholder="50">
                </div>
                <div class="form-group">
                    <label>Скорость (км/ч):</label>
                    <input type="number" id="time-speed" placeholder="35">
                </div>
                <div class="form-group">
                    <label>Территория:</label>
                    <select id="time-faction">
                        <option value="1">Своя (100%)</option>
                        <option value="0.7">Дружеская (70%)</option>
                        <option value="0.35">Вражеская (35%)</option>
                    </select>
                </div>
                <div class="form-check">
                    <input type="checkbox" id="time-march"> <label for="time-march">Марш-бросок</label>
                </div>
                <button class="btn-primary" onclick="calcTimeTravel()">Рассчитать</button>
                <div class="result-box" id="time-result">...</div>
            </div>

            <div class="tool-card">
                <h3>🛣️ Смешанный путь</h3>
                <div class="form-group">
                    <label>1-я часть (км | тип):</label>
                    <div class="input-row">
                        <input type="number" id="road-dist1" placeholder="Км">
                        <select id="road-terrain1">
                            <option value="neutral">Своя</option>
                            <option value="friendly">Друг</option>
                            <option value="enemy">Враг</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Скорость армии:</label>
                    <input type="number" id="road-speed" placeholder="км/ч">
                </div>
                <button class="btn-primary" onclick="calcRoadTravel()">Рассчитать</button>
                <div class="result-box" id="road-result">...</div>
            </div>

            <div class="tool-card">
                <h3>🏗️ Строительство</h3>
                <div class="form-group">
                    <label>Объект:</label>
                    <select id="build-type">
                        <option value="50|8">Крепость 1 (8ч)</option>
                        <option value="50|16">Крепость 2 (16ч)</option>
                        <option value="40|48">Фабрика (48ч)</option>
                        <option value="60|72">Ж/Д (72ч)</option>
                    </select>
                </div>
                <div class="input-row">
                    <div class="form-group"><label>Мораль %</label><input type="number" id="build-morale" value="100"></div>
                    <div class="form-group"><label>Тек. HP</label><input type="number" id="build-hp" value="0"></div>
                </div>
                <button class="btn-primary" onclick="calcConstruction()">Рассчитать</button>
                <div class="result-box" style="text-align: center;">
                    <div class="build-label">До +1 HP (<span id="build-next-hp">1</span>):</div>
                    <div id="build-timer" style="font-size: 1.4rem; font-weight: bold;">0д 00:00:00</div>
                    <div id="build-info" style="font-size: 0.7rem;">Введите данные</div>
                </div>
            </div>

            <div class="tool-card">
                <h3>❤️ Мораль и HP</h3>
                <div class="form-group">
                    <label>Мораль своя (%):</label>
                    <input type="number" id="moral-val" placeholder="100">
                </div>
                <div class="form-group">
                    <label>Пехота (Тек / Макс):</label>
                    <div class="input-row">
                        <input type="number" id="inf-hp" placeholder="HP">
                        <input type="number" id="inf-max" placeholder="Max">
                    </div>
                </div>
                <button class="btn-primary" onclick="calcMorale()">Рассчитать</button>
                <div class="result-box" id="moral-result">...</div>
            </div>

        </div>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>

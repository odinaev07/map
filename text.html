<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S1914 Construction Tracker</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --accent: #4caf50; --text: #e0e0e0; --input-bg: #2a2a2a; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; }
        .card { background: var(--card); padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333; }
        h2 { color: var(--accent); margin-top: 0; font-size: 1.3rem; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
        label { display: block; margin: 15px 0 5px; font-size: 0.85rem; color: #888; }
        select, input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #333; background: var(--input-bg); color: #fff; box-sizing: border-box; font-size: 1rem; outline: none; transition: border 0.2s; }
        select:focus, input:focus { border-color: var(--accent); }
        .result-box { margin-top: 20px; padding: 20px; background: #151515; border-radius: 8px; border-left: 4px solid var(--accent); }
        .highlight { color: var(--accent); font-weight: bold; font-size: 1.6rem; margin: 5px 0; }
        .info-text { font-size: 0.85rem; color: #777; margin-top: 10px; line-height: 1.5; border-top: 1px solid #333; padding-top: 10px; }
        .hp-step { color: #aaa; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="card">
    <h2>S1914 Construction</h2>

    <label>Тип строения:</label>
    <select id="building" onchange="calc()">
        <optgroup label="Крепости (50 HP)">
            <option value="50|8">Крепость 1 ур (8ч)</option>
            <option value="50|16">Крепость 2 ур (16ч)</option>
            <option value="50|24">Крепость 3 ур (24ч)</option>
            <option value="50|32">Крепость 4 ур (32ч)</option>
            <option value="50|40">Крепость 5 ур (40ч)</option>
        </optgroup>
        <optgroup label="Инфраструктура">
            <option value="40|48">Фабрика (40 HP / 48ч)</option>
            <option value="40|24">Казармы (40 HP / 24ч)</option>
            <option value="60|72">Ж/Д дорога (60 HP / 72ч)</option>
            <option value="60|24">Аэродром (60 HP / 24ч)</option>
            <option value="60|72">Порт (60 HP / 72ч)</option>
        </optgroup>
    </select>

    <label>Мораль провинции (%):</label>
    <input type="number" id="morale" value="100" min="0" max="100" oninput="calc()">

    <label>Текущее HP (целое число):</label>
    <input type="number" id="currentHp" value="18" min="0" oninput="calc()">

    <div class="result-box">
        <div class="hp-step">Таймер при переходе на <span id="nextHpLabel" style="color:var(--accent)">19</span> HP:</div>
        <div id="targetTimer" class="highlight">--ч --м</div>
        
        <div class="info-text" id="totalInfo"></div>
    </div>
</div>

<script>
function calc() {
    const morale = parseFloat(document.getElementById('morale').value) || 0;
    const currentHp = parseFloat(document.getElementById('currentHp').value) || 0;
    
    const buildData = document.getElementById('building').value.split('|');
    const maxHp = parseFloat(buildData[0]);
    const baseTotalHours = parseFloat(buildData[1]);

    // Коэффициент k (твои формулы)
    let k = (morale <= 80) ? (0.2 + 0.01 * morale) : (0.6 + 0.005 * morale);

    // Базовое время на 1 единицу HP
    const baseTimePerHp = baseTotalHours / maxHp;

    // Фактическое время на 1 HP с учетом морали
    const actualTimePerHp = baseTimePerHp / k;

    // Общее время, которое сейчас должно быть на таймере (от текущего HP до конца)
    const totalHoursOnTimer = (maxHp - currentHp) * actualTimePerHp;

    // Время, которое будет на таймере, когда добавится +1 HP
    const timerAtNextHp = totalHoursOnTimer - actualTimePerHp;

    const format = (hrs) => {
        if (hrs <= 0) return "0ч 00м";
        const h = Math.floor(hrs);
        const m = Math.round((hrs - h) * 60);
        return `${h}ч ${String(m).padStart(2, '0')}м`;
    };

    // Вывод результатов
    const nextHp = Math.floor(currentHp + 1);
    document.getElementById('nextHpLabel').innerText = nextHp > maxHp ? maxHp : nextHp;
    document.getElementById('targetTimer').innerText = format(timerAtNextHp);
    
    document.getElementById('totalInfo').innerHTML = `
        Всего до конца: <b>${format(totalHoursOnTimer)}</b><br>
        1 HP строится: <b>${Math.floor(actualTimePerHp * 60)} мин.</b>
    `;
}

// Запуск при старте
calc();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S1914 Construction Tracker Ultra</title>
    <style>
        :root { --bg: #0d0d0d; --card: #161616; --accent: #00ff88; --text: #f0f0f0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; }
        .card { background: var(--card); padding: 25px; border-radius: 15px; width: 100%; max-width: 450px; box-shadow: 0 0 30px rgba(0,0,0,0.7); border: 1px solid #222; }
        h2 { color: var(--accent); margin: 0 0 20px; font-size: 1rem; text-align: center; letter-spacing: 3px; border-bottom: 1px solid #222; padding-bottom: 15px; }
        label { display: block; margin: 15px 0 5px; font-size: 0.75rem; color: #777; text-transform: uppercase; }
        select, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 1rem; outline: none; }
        select:focus, input:focus { border-color: var(--accent); }
        .result-box { margin-top: 25px; padding: 20px; background: #0a0a0a; border-radius: 10px; border: 1px solid #222; box-shadow: inset 0 0 10px #000; }
        .hp-step { color: #888; font-size: 0.8rem; margin-bottom: 10px; text-align: center; }
        .highlight { color: var(--accent); font-weight: bold; font-size: 1.8rem; font-family: 'Consolas', monospace; text-align: center; display: block; }
        .info-text { font-size: 0.85rem; color: #555; margin-top: 20px; border-top: 1px solid #222; padding-top: 15px; line-height: 1.7; }
        b { color: #999; }
        .next-hp-val { color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>STRATEGY CALCULATOR</h2>

    <label>Объект строительства:</label>
    <select id="building" onchange="calc()">
        <optgroup label="Крепости (50 HP)">
            <option value="50|8">Крепость 1 ур (8ч)</option>
            <option value="50|16">Крепость 2 ур (16ч)</option>
            <option value="50|24">Крепость 3 ур (24ч)</option>
            <option value="50|32">Крепость 4 ур (32ч)</option>
            <option value="50|40">Крепость 5 ур (40ч)</option>
        </optgroup>
        <optgroup label="Инфраструктура">
            <option value="40|48">Фабрика (40 HP / 48ч)</option>
            <option value="40|24">Казармы (40 HP / 24ч)</option>
            <option value="60|72">Железная дорога (60 HP / 72ч)</option>
            <option value="60|24">Аэродром (60 HP / 24ч)</option>
            <option value="60|72">Порт (60 HP / 72ч)</option>
        </optgroup>
    </select>

    <label>Мораль провинции (%):</label>
    <input type="number" id="morale" value="100" min="0" max="100" oninput="calc()">

    <label>Текущее HP (целое):</label>
    <input type="number" id="currentHp" value="18" min="0" oninput="calc()">

    <div class="result-box">
        <div class="hp-step">Таймер игры при <span class="next-hp-val" id="nextHpLabel">19</span> HP:</div>
        <div id="targetTimer" class="highlight">0д 00:00:00</div>
        
        <div class="info-text" id="totalInfo"></div>
    </div>
</div>

<script>
function calc() {
    const morale = parseFloat(document.getElementById('morale').value) || 0;
    const currentHp = parseFloat(document.getElementById('currentHp').value) || 0;
    
    const buildData = document.getElementById('building').value.split('|');
    const maxHp = parseFloat(buildData[0]);
    const baseTotalHours = parseFloat(buildData[1]);

    // Коэффициент k
    let k = (morale <= 80) ? (0.2 + 0.01 * morale) : (0.6 + 0.005 * morale);

    // Время на 1 HP
    const actualTimePerHp = (baseTotalHours / maxHp) / k;

    // Таймер до полной готовности
    const totalHoursOnTimer = (maxHp - currentHp) * actualTimePerHp;

    // Таймер в момент +1 HP
    const timerAtNextHp = totalHoursOnTimer - actualTimePerHp;

    // Универсальное форматирование: Дни, Часы:Мин:Сек
    const formatFull = (totalHours) => {
        if (totalHours <= 0) return "0д 00:00:00";
        
        const totalSeconds = Math.round(totalHours * 3600);
        const d = Math.floor(totalSeconds / 86400);
        const h = Math.floor((totalSeconds % 86400) / 3600);
        const m = Math.floor((totalSeconds % 3600) / 60);
        const s = totalSeconds % 60;

        return `${d}д ${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    };

    // Вывод
    const nextHp = Math.floor(currentHp + 1);
    document.getElementById('nextHpLabel').innerText = nextHp > maxHp ? maxHp : nextHp;
    document.getElementById('targetTimer').innerText = formatFull(timerAtNextHp);
    
    // Расчет цикла 1 HP
    const cycleSeconds = Math.round(actualTimePerHp * 3600);
    const cM = Math.floor(cycleSeconds / 60);
    const cS = cycleSeconds % 60;

    document.getElementById('totalInfo').innerHTML = `
        До полной готовности: <b>${formatFull(totalHoursOnTimer)}</b><br>
        Скорость: 1 HP каждые <b>${cM}м ${cS}с</b><br>
        Текущий коэфф. (k): <b>${k.toFixed(3)}</b>
    `;
}

calc();
</script>

</body>
</html>
